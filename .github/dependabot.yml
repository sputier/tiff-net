version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tools:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*", "BenchmarkDotNet*"]

  - package-ecosystem: pip
    directories: ["/docs", "/tools"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
