site_name: Eleris.TiffNet
site_description: A .NET library to read and write TIFF images, made for astronomy and scientific data.
repo_url: https://github.com/sputier/tiff-net
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: false

exclude_docs: |
  examples/
  requirements.txt

nav:
  - Home: index.md
  - Guide:
    - Reliability and limits: reliability.md
  - Design:
    - Public API: design/api.md
    - TIFF coverage: design/coverage.md
    - Architecture: design/architecture.md
    - Backlog: design/backlog.md
    - Review of the first implementation: review-2026-11-05.md
  # BEGIN API NAVIGATION
  - API reference:
    - Overview: api/index.md
    - Eleris.TiffNet:
      - "TiffColorModel": api/Eleris.TiffNet.TiffColorModel.md
      - "TiffCompression": api/Eleris.TiffNet.TiffCompression.md
      - "TiffException": api/Eleris.TiffNet.TiffException.md
      - "TiffExtraChannel": api/Eleris.TiffNet.TiffExtraChannel.md
      - "TiffExtraChannelKind": api/Eleris.TiffNet.TiffExtraChannelKind.md
      - "TiffFile": api/Eleris.TiffNet.TiffFile.md
      - "TiffImage": api/Eleris.TiffNet.TiffImage.md
      - "TiffLayout": api/Eleris.TiffNet.TiffLayout.md
      - "TiffMetadata": api/Eleris.TiffNet.TiffMetadata.md
      - "TiffPhotometric": api/Eleris.TiffNet.TiffPhotometric.md
      - "TiffPixelOrder": api/Eleris.TiffNet.TiffPixelOrder.md
      - "TiffPixelScale": api/Eleris.TiffNet.TiffPixelScale.md
      - "TiffPredictor": api/Eleris.TiffNet.TiffPredictor.md
      - "TiffReadOptions": api/Eleris.TiffNet.TiffReadOptions.md
      - "TiffResolution": api/Eleris.TiffNet.TiffResolution.md
      - "TiffResolutionUnit": api/Eleris.TiffNet.TiffResolutionUnit.md
      - "TiffSampleType": api/Eleris.TiffNet.TiffSampleType.md
      - "TiffStorage": api/Eleris.TiffNet.TiffStorage.md
      - "TiffTag": api/Eleris.TiffNet.TiffTag.md
