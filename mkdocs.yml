site_name: Eleris.TiffNet
site_description: A .NET library to read and write TIFF images, made for astronomy and scientific data.
repo_url: https://github.com/sputier/tiff-net
docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - toc:
      permalink: false

exclude_docs: |
  examples/
  requirements.txt

nav:
  - Home: index.md
  - Guide:
    - Getting started: getting-started.md
    - Files and pages: files.md
    - Reading pixels: pixels.md
    - Metadata and Astro-TIFF: metadata.md
    - Writing: writing.md
    - Large images: large-images.md
    - Threads and memory: threads.md
    - Reliability and limits: reliability.md
    - Performance: performance.md
    - Platforms: platforms.md
    - Coverage of the standard: standard-coverage.md
  - Design:
    - Public API: design/api.md
    - TIFF coverage (superseded): design/coverage.md
    - Architecture: design/architecture.md
    - Backlog: design/backlog.md
    - Review of the first implementation: review-2026-11-05.md
    - Review of version 0.1.0: review-2026-11-06.md
    - Fuzzing campaign (November 2026): fuzzing-2026-11.md
  # BEGIN API NAVIGATION
